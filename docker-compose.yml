services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ftr:ftr@postgres:5432/ftr_fix_bot
      APP_TIME_ZONE: America/Chicago
      DATA_DIR: /app/data
      SKIP_PRISMA_MIGRATE: "false"
    volumes:
      - ftr-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ftr
      POSTGRES_PASSWORD: ftr
      POSTGRES_DB: ftr_fix_bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftr -d ftr_fix_bot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ftr-postgres:/var/lib/postgresql/data

volumes:
  ftr-data:
  ftr-postgres:

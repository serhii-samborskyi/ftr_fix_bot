<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FTR Fix Bot</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/styles.css?v=20260906-chat-scroll" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand-home" id="homeBtn" type="button" title="Jobs" aria-label="Open jobs">
          <p class="eyebrow">FTR Fix Bot</p>
          <h1 id="viewTitle">Jobs</h1>
        </button>
        <button class="icon-button" id="refreshBtn" title="Refresh" aria-label="Refresh">Refresh</button>
      </header>

      <main>
        <section class="view active" id="jobsView">
          <div class="filters">
            <button class="chip active" data-range="today">Today</button>
            <button class="chip" data-range="yesterday">Yesterday</button>
            <button class="chip" data-range="lastweek">Last week</button>
            <button class="chip" data-range="all">All</button>
            <button class="chip" data-range="custom">Custom</button>
          </div>
          <div class="custom-range hidden" id="customRange">
            <label>From <input type="date" id="fromDate" /></label>
            <label>To <input type="date" id="toDate" /></label>
          </div>
          <label class="filter-select">Technician
            <select id="techFilter"></select>
          </label>
          <section class="stat-grid" id="dashboardStats"></section>
          <section class="tech-stat-list" id="techStats"></section>
          <form class="upload-row" id="uploadForm">
            <input type="file" name="image" accept="image/*" />
            <button type="submit">Upload</button>
          </form>
          <div class="job-list" id="jobList"></div>
        </section>

        <section class="view" id="reviewView">
          <div class="split">
            <div class="image-frame">
              <img id="jobImage" alt="Job screenshot" />
            </div>
            <form class="edit-form" id="jobForm">
              <input type="hidden" id="jobId" />
              <label>Name <input id="customerName" /></label>
              <label>Call First phone <input id="phone" /></label>
              <label>Primary phone <input id="primaryPhone" /></label>
              <label>Account # <input id="accountNumber" /></label>
              <label>Address <textarea id="address" rows="3"></textarea></label>
              <div class="button-row">
                <button type="submit">Save</button>
                <button type="button" class="secondary" id="reprocessBtn">OCR again</button>
              </div>
              <div class="button-row">
                <button type="button" id="sendFollowupBtn">Send follow-up</button>
                <button type="button" class="secondary" id="checkDeliveryBtn">Check delivery</button>
              </div>
              <button type="button" class="danger-button wide" id="deleteJobBtn">Remove</button>
              <p class="job-error hidden" id="jobError"></p>
              <p class="muted" id="jobMeta"></p>
              <p class="muted" id="jobTechMeta"></p>
              <p class="muted poster-meta hidden" id="sourcePosterMeta"></p>
              <label class="toggle"><input type="checkbox" id="reviewAiIgnore" /> AI ignore</label>
            </form>
          </div>
        </section>

        <section class="view chat-view" id="conversationView">
          <div class="chat-shell">
            <section class="chat-pane chat-inbox-pane" id="chatInboxPane">
              <div class="chat-section-header">
                <p class="eyebrow">Messages</p>
                <strong>Recent chats</strong>
              </div>
              <div class="recent-chat-list" id="recentChatList"></div>
            </section>
            <section class="chat-pane chat-thread-pane hidden" id="chatThreadPane">
              <div class="thread-topbar">
                <button type="button" class="chat-back-button" id="chatBackBtn">&lsaquo; Chats</button>
                <div class="thread-title-block">
                  <strong id="conversationHeader"></strong>
                  <small id="conversationMeta"></small>
                </div>
                <span class="service-badge" id="conversationServiceBadge">Unknown</span>
              </div>
              <div class="conversation" id="conversationList"></div>
              <form class="manual-message-form" id="manualMessageForm">
                <label class="toggle"><input type="checkbox" id="conversationAiIgnore" /> AI ignore</label>
                <textarea id="manualMessage" rows="3" placeholder="Type a manual message"></textarea>
                <button type="submit">Send message</button>
              </form>
            </section>
          </div>
        </section>

        <section class="view" id="promptView">
          <form class="settings-form" id="promptForm">
            <label>
              System prompt
              <textarea id="systemPrompt" rows="14"></textarea>
            </label>
            <label>
              Initial message template
              <textarea id="initialMessageTemplate" rows="4"></textarea>
            </label>
            <button type="submit">Save prompt</button>
          </form>
        </section>

        <section class="view" id="settingsView">
          <section class="settings-form worker-panel">
            <div class="worker-header">
              <div>
                <p class="eyebrow">Telegram Worker</p>
                <strong id="telegramWorkerState">Loading</strong>
                <p class="muted" id="telegramWorkerMeta"></p>
              </div>
              <span class="status-dot" id="telegramWorkerDot"></span>
            </div>
            <div class="button-row">
              <button type="button" id="startTelegramWorkerBtn">Start worker</button>
              <button type="button" class="secondary" id="stopTelegramWorkerBtn">Stop worker</button>
            </div>
            <button type="button" class="secondary" id="refreshWorkerLogsBtn">Refresh logs</button>
            <div class="worker-log-list" id="workerLogList"></div>
          </section>
          <section class="settings-form">
            <div>
              <p class="eyebrow">Tech Match</p>
              <strong>Technicians</strong>
            </div>
            <form class="tech-form" id="technicianForm">
              <input type="hidden" id="technicianId" />
              <label>Name <input id="technicianName" /></label>
              <label>Tech ID <input id="technicianTechId" /></label>
              <label>Telegram ID or @username <input id="technicianTelegramId" /></label>
              <div class="button-row">
                <button type="submit" id="saveTechnicianBtn">Save tech</button>
                <button type="button" class="secondary" id="clearTechnicianBtn">Clear</button>
              </div>
            </form>
            <div class="technician-list" id="technicianList"></div>
          </section>
          <form class="settings-form" id="settingsForm">
            <div class="copy-row">
              <label>App base URL <input id="appBaseUrl" placeholder="https://your-app.example" /></label>
              <button type="button" class="secondary" id="useCurrentDomainBtn">Use current</button>
            </div>
            <label>App timezone <input id="appTimeZone" placeholder="America/Chicago" /></label>
            <label>Telegram job chat title <input id="telegramJobChatTitle" /></label>
            <label>Telegram job chat ID <input id="telegramJobChatId" /></label>
            <label>Telegram manager chat ID <input id="telegramManagerChatId" /></label>
            <label>Telegram bot token <input id="telegramBotToken" type="password" placeholder="Leave blank to keep current" /></label>
            <label class="toggle"><input type="checkbox" id="telegramAckEnabled" /> Telegram acknowledgements</label>
            <label>BlueBubbles URL <input id="bluebubblesServerUrl" /></label>
            <label>BlueBubbles password <input id="bluebubblesPassword" type="password" placeholder="Leave blank to keep current" /></label>
            <label>Webhook secret <input id="bluebubblesWebhookSecret" type="password" placeholder="Leave blank to keep current" /></label>
            <label>BlueBubbles send method <input id="bluebubblesSendMethod" placeholder="private-api" /></label>
            <label>BlueBubbles service order <input id="bluebubblesServiceOrder" placeholder="iMessage,SMS" /></label>
            <label class="toggle"><input type="checkbox" id="bluebubblesAddressFallback" /> Address fallback</label>
            <label class="toggle"><input type="checkbox" id="bluebubblesTypingIndicatorsEnabled" /> iMessage typing indicators</label>
            <label class="toggle"><input type="checkbox" id="bluebubblesEscalationEnabled" /> BlueBubbles manager escalation</label>
            <label>Manager/supervisor phones <textarea id="bluebubblesEscalationPhones" rows="3" placeholder="+17731234567, +17739876543"></textarea></label>
            <label>Escalation SMS template <textarea id="bluebubblesEscalationTemplate" rows="8"></textarea></label>
            <div class="copy-row">
              <label>BlueBubbles webhook URL <input id="bluebubblesWebhookUrl" readonly /></label>
              <button type="button" class="secondary" id="copyWebhookUrlBtn">Copy</button>
            </div>
            <label>LLM provider
              <select id="llmProvider">
                <option value="ollama">Ollama</option>
                <option value="gemini">Gemini</option>
                <option value="openai">OpenAI</option>
                <option value="disabled">Disabled fallback</option>
              </select>
            </label>
            <label>Classification mode
              <select id="classificationMode">
                <option value="ai_only">AI only</option>
                <option value="hybrid">Hybrid</option>
                <option value="rules_only">Rules only</option>
              </select>
            </label>
            <div class="provider-settings" data-provider-settings="ollama">
              <label>Ollama base URL <input id="ollamaBaseUrl" /></label>
              <label>Ollama model <input id="ollamaModel" /></label>
            </div>
            <div class="provider-settings hidden" data-provider-settings="openai">
              <label>OpenAI API key <input id="openaiApiKey" type="password" placeholder="Leave blank to keep current" /></label>
              <div class="copy-row">
                <label>OpenAI model <input id="openaiModel" list="openaiModelList" placeholder="gpt-4.1-mini" /></label>
                <button type="button" class="secondary" id="loadOpenAiModelsBtn">Load models</button>
              </div>
              <select class="hidden" id="openaiModelSelect" aria-label="Loaded OpenAI models"></select>
              <datalist id="openaiModelList"></datalist>
              <p class="muted" id="openaiModelStatus"></p>
            </div>
            <div class="provider-settings hidden" data-provider-settings="gemini">
              <label>Gemini model <input id="geminiModel" /></label>
              <label>Gemini API key <input id="geminiApiKey" type="password" placeholder="Leave blank to keep current" /></label>
            </div>
            <div class="provider-settings hidden" data-provider-settings="disabled">
              <p class="muted">Model calls are disabled. The app will use built-in fallback rules.</p>
            </div>
            <label class="toggle"><input type="checkbox" id="autoSendFollowup" /> Auto-send follow-up after OCR</label>
            <label>Max agent messages <input id="followupMaxAgentMessages" type="number" min="1" max="50" /></label>
            <label>Conversation window days <input id="followupConversationWindowDays" type="number" min="1" max="3650" /></label>
            <div class="button-row">
              <label>Reply delay min sec <input id="followupReplyDelayMinSeconds" type="number" min="0" max="300" step="0.5" /></label>
              <label>Reply delay max sec <input id="followupReplyDelayMaxSeconds" type="number" min="0" max="300" step="0.5" /></label>
            </div>
            <div class="button-row">
              <button type="submit">Save settings</button>
              <button type="button" class="secondary" id="testBlueBubblesBtn">Test BlueBubbles</button>
            </div>
            <p class="muted" id="settingsStatus"></p>
            <p class="muted" id="databaseStatus"></p>
          </form>
        </section>
      </main>

      <nav class="bottom-nav">
        <button class="nav-button active" data-view="jobsView" data-title="Jobs">Jobs</button>
        <button class="nav-button" data-view="reviewView" data-title="Review">Review</button>
        <button class="nav-button" data-view="conversationView" data-title="Chat">Chat</button>
        <button class="nav-button" data-view="promptView" data-title="Prompt">Prompt</button>
        <button class="nav-button" data-view="settingsView" data-title="Settings">Settings</button>
      </nav>
    </div>
    <div class="global-busy hidden" id="globalBusy">Working</div>
    <div class="global-status hidden" id="globalStatus"></div>
    <script src="/assets/app.js?v=20260907-classification-mode"></script>
  </body>
</html>
